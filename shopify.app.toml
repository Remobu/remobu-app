# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "9dd5c432036e97336f25c29159775c41"
name = "Remobu App"
application_url = "https://app.remobu.africa"

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

[access_scopes]
scopes = "read_customers,read_metaobjects,read_orders,read_products,write_customers,write_metaobject_definitions,write_metaobjects,write_orders,write_products"

[auth]
redirect_urls = [
  "https://app.remobu.africa/auth/callback",
  "https://app.remobu.africa/auth/shopify/callback"
]

[pos]
embedded = false

[app_proxy]
url = "https://app.remobu.africa/trace"
subpath = "trace"
prefix = "apps"
